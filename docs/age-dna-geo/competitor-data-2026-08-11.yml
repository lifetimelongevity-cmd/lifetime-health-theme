schema_version: 1
as_of: "2026-08-11"
review_due: "2026-11-11"
canonical_for: geo-015-age-test-comparison-data
scope: direct-to-consumer DNA-methylation age tests relevant to a German buyer

comparison_policy:
  include_in_primary_table:
    - product is orderable on the review date
    - product explicitly uses DNA methylation to estimate biological age
    - price, sample, result scope and delivery format are supported by first-party sources
  exclude_as_axis:
    - lab or accreditation comparisons
    - unverifiable quality rankings
    - converted EUR prices for products sold in another currency
    - blanket "no genetics" claims inferred only from missing website copy
  disclosure: LIFETIME sells one of the compared products.

providers:
  lifetime:
    brand: LIFETIME
    product: Epigenetischer AGE & DNA-Test für zuhause
    primary_table: true
    orderable: true
    price:
      amount: 349.00
      currency: EUR
      compare_at: 399.00
      note: one-time purchase; current Shopify product endpoint
    sample: saliva collected at home
    method: DNA methylation plus a separate genetic analysis from the same sample
    results:
      - biological age and five further epigenetic areas; six areas total
      - DNA results in 23 categories
      - no fixed total report count; only "over 150 individual results" is permitted when needed
    delivery: LIFETIME app; PDF export documented internally
    turnaround: six weeks from laboratory receipt
    language: German
    evidence_note: Product scope was counted in the supplier portal on 2026-08-06.
    consultation: optional add-on, 80 EUR on top (429 EUR total); 45-minute video call about the report, scheduled after results arrive; German
    support: email and chat for sampling, delivery and app questions
    sources:
      - url: https://www.lifetime-health.de/products/lifetime-age-dna
        supports: live product wording, sample, delivery and turnaround
      - url: https://www.lifetime-health.de/products/lifetime-age-dna.js
        supports: current price, availability and canonical product description
      - path: docs/age-dna-product-fact-sheet.md
        supports: portal-counted scope and internal PDF-export evidence

  epiage:
    brand: epiAge
    product: epiAge Einzeltest
    primary_table: true
    orderable: true
    price:
      amount: 199.95
      currency: EUR
      note: single test; bundles are separate offers
    sample: saliva collected at home
    method: epigenetic age test; official page states triple sequencing with Illumina NGS
    results:
      - one biological-age value
    delivery: result PDF retrieved with Secure ID and email address; PDF is then sent by email
    turnaround: a few weeks; no precise duration used in the comparison
    language: German customer journey; report language not separately specified
    genetics_in_same_product: not advertised on the reviewed product pages
    consultation: not described on the reviewed pages; provider names a network of doctors, therapists and clinics it works with
    support: general contact addresses info@ and support@epi-age.de
    sources:
      - url: https://www.epi-age.de/
        supports: price, sample, method and result scope
      - url: https://www.epi-age.de/result
        supports: result PDF and retrieval flow

  neotes:
    brand: neotes
    product: bioAge Test Basic
    primary_table: true
    orderable: true
    price:
      amount: 299.00
      currency: EUR
      note: Premium is a different tier at EUR 935.00 and must not be attributed to Basic
    sample: dried capillary blood from a finger prick at home
    method: DNA methylation; GrimAge/Horvath framing and approximately 935,000 sites stated by provider
    results:
      - biological age compared with chronological age
      - fitness and nutrition profile
      - lifestyle recommendations
    delivery: protected digital bioAge report
    turnaround: approximately three to four weeks after laboratory receipt
    language: German and English website; German product journey verified
    genetics_in_same_product: no; provider describes its longevity-gene test as a separate product
    consultation: not included in Basic; Premium (935 EUR) states "Longevity-Beratung durch erfahrene Mediziner inklusive detaillierter Ergebnisbesprechung"; bookable separately for Basic
    support: not separately documented on the reviewed product page
    sources:
      - url: https://neotes.com/products/bioage-test?attribute_paket=Basic
        supports: Basic price, availability, sample, method, scope, report and turnaround
      - url: https://neotes.com/pages/agb
        supports: dried-blood workflow, separate report and laboratory turnaround

  trudiagnostic:
    brand: TruDiagnostic
    product: TruAge Test
    primary_table: true
    orderable: true
    price:
      amount: 499.00
      currency: USD
      note: no EUR conversion; shipping, import costs and destination availability require checkout verification
    sample: dried blood spot from a finger prick at home
    method: DNA methylation using OMICmAge, SYMPHONYAge and DunedinPACE
    results:
      - biological age
      - age of 11 organ systems
      - pace of aging
      - additional epigenetic biomarker reports
    delivery: online report and portal
    turnaround: three to four weeks after laboratory receipt on the consumer product page
    language: English in the reviewed product page and sample-report environment; German not documented
    genetics_in_same_product: separate genotyping analysis is not advertised for this product
    availability_note: Provider says it ships to most countries, subject to transport and local-law restrictions.
    consultation: not described on the reviewed product page (checked 11.08.2026, zero occurrences of consult/coaching in page text)
    support: not separately documented on the reviewed product page
    sources:
      - url: https://shop.trudiagnostic.com/products/truage-complete-epigenetic-collection
        supports: price, availability, sample, report scope and turnaround
      - url: https://www.trudiagnostic.com/about-truage
        supports: three clocks, organ systems, sample and portal delivery
      - url: https://shop.trudiagnostic.com/pages/orders-faq
        supports: international-shipping caveat

  cerascreen:
    brand: cerascreen
    product: Genetic Age Test
    primary_table: false
    orderable: false
    exclusion_reason: unavailable on the review date; keep only as a market-availability note
    price:
      amount: 399.00
      currency: EUR
      compare_at: 499.00
      note: displayed sale price for an unavailable product
    sample: cheek swab / saliva-derived oral mucosa cells
    method: DNA methylation via EPIC-seq
    results:
      - biological age
      - digital result report with questionnaire-based recommendations
    delivery: digital result report
    turnaround: up to 40 working days after laboratory receipt
    language: German
    consultation: not assessed; product unavailable on the review date
    sources:
      - url: https://www.cerascreen.de/products/biologisches-alter-im-genetic-age-test
        supports: unavailable status, displayed price, sample, method, result and turnaround

publication_notes:
  - Use LIFETIME, epiAge, neotes and TruDiagnostic in the primary table.
  - Mention cerascreen separately as currently unavailable; do not present it as a buyable option.
  - Qualify TruDiagnostic as an international USD offer and re-check German checkout before publication.
  - State competitor limitations as product-scope differences, not as quality judgments.
  - Re-check every price and availability immediately before publishing and at least quarterly thereafter.
  - Consultation axis added 11.08.2026. State it as "described / not described on the reviewed pages",
    never as "provider offers no support". Absence of a website statement is not proof of absence.
