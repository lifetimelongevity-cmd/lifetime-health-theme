<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#f7f4ee"/>
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="#ffffff" stroke="#e7e3db"/>
  <text x="90" y="118" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">WARUM VERSCHIEDENE UHREN VERSCHIEDENE WERTE LIEFERN</text>
  <text x="90" y="172" fill="#26251e" font-size="40" font-weight="400" letter-spacing="-0.5">Vier Uhren, vier verschiedene Zielgrößen</text>
  <line x1="90" y1="212" x2="1110" y2="212" stroke="#eceae3" stroke-width="1"/>

  <text x="90" y="284" fill="#26251e" font-size="25" font-weight="500">Horvath und Hannum</text>
  <text x="90" y="312" fill="#6b6b63" font-size="18">trainiert auf das kalendarische Alter: wie alt wirkt dieses Profil?</text>
  <line x1="90" y1="340" x2="1110" y2="340" stroke="#f0eee7" stroke-width="1"/>

  <text x="90" y="372" fill="#26251e" font-size="25" font-weight="500">PhenoAge</text>
  <text x="90" y="400" fill="#6b6b63" font-size="18">trainiert auf klinische Messwerte, die mit Lebensspanne und Gesundheit zusammenhängen</text>
  <line x1="90" y1="428" x2="1110" y2="428" stroke="#f0eee7" stroke-width="1"/>

  <text x="90" y="460" fill="#26251e" font-size="25" font-weight="500">GrimAge</text>
  <text x="90" y="488" fill="#6b6b63" font-size="18">trainiert auf Schätzer für Bluteiweiße und Rauchverhalten, ausgelegt auf Lebenszeit</text>
  <line x1="90" y1="516" x2="1110" y2="516" stroke="#f0eee7" stroke-width="1"/>

  <text x="90" y="548" fill="#26251e" font-size="25" font-weight="500">DunedinPACE</text>
  <text x="90" y="576" fill="#6b6b63" font-size="18">misst keine Alterszahl, sondern ein Tempo: wie schnell verändern sich Organfunktionen?</text>
</svg>
