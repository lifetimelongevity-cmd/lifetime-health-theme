<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Schema: dieselbe DNA, zweimal gelesen. Oben die genetische Analyse mit Varianten an definierten Stellen, unten die epigenetische Analyse mit chemischen Markierungen auf der DNA.">
  <rect width="620" height="440" fill="#f7f4ee"/>
  <rect x="20" y="20" width="580" height="400" rx="14" fill="#ffffff" stroke="#e7e3db"/>

  <text x="48" y="60" fill="#6b6b63" font-size="15" font-weight="500" letter-spacing="1.6">ZWEI LESEWEISEN DERSELBEN DNA</text>
  <text x="48" y="96" fill="#26251e" font-size="26" font-weight="400" letter-spacing="-0.3">Dieselbe DNA, zwei Messungen</text>
  <line x1="48" y1="116" x2="572" y2="116" stroke="#eceae3" stroke-width="1"/>

  <!-- Ebene 1: Genotypisierung -->
  <text x="48" y="146" fill="#26251e" font-size="17" font-weight="500">Genetische Analyse</text>
  <text x="48" y="168" fill="#6b6b63" font-size="15">liest Varianten an definierten Stellen im Erbgut</text>

  <rect x="48" y="186" width="380" height="10" rx="5" fill="#eceae3"/>
  <circle cx="120" cy="191" r="7" fill="#4a8c85"/>
  <circle cx="238" cy="191" r="7" fill="#4a8c85"/>
  <circle cx="356" cy="191" r="7" fill="#4a8c85"/>
  <text x="572" y="196" fill="#26251e" font-size="15" font-weight="500" text-anchor="end">konstant</text>

  <text x="48" y="222" fill="#6b6b63" font-size="15">Welche Variante dort liegt, steht von Geburt an fest.</text>

  <line x1="48" y1="246" x2="572" y2="246" stroke="#f0eee7" stroke-width="1"/>

  <!-- Ebene 2: Methylierung -->
  <text x="48" y="276" fill="#26251e" font-size="17" font-weight="500">Epigenetische Analyse</text>
  <text x="48" y="298" fill="#6b6b63" font-size="15">liest chemische Markierungen an CpG-Stellen</text>

  <circle cx="96" cy="322" r="7" fill="#4a8c85"/>
  <circle cx="168" cy="322" r="7" fill="#a8cfc9"/>
  <circle cx="240" cy="322" r="7" fill="#4a8c85"/>
  <circle cx="312" cy="322" r="7" fill="#a8cfc9"/>
  <circle cx="384" cy="322" r="7" fill="#4a8c85"/>
  <line x1="96" y1="329" x2="96" y2="336" stroke="#4a8c85" stroke-width="2"/>
  <line x1="168" y1="329" x2="168" y2="336" stroke="#a8cfc9" stroke-width="2"/>
  <line x1="240" y1="329" x2="240" y2="336" stroke="#4a8c85" stroke-width="2"/>
  <line x1="312" y1="329" x2="312" y2="336" stroke="#a8cfc9" stroke-width="2"/>
  <line x1="384" y1="329" x2="384" y2="336" stroke="#4a8c85" stroke-width="2"/>
  <rect x="48" y="336" width="380" height="10" rx="5" fill="#eceae3"/>
  <text x="572" y="346" fill="#26251e" font-size="15" font-weight="500" text-anchor="end">veränderlich</text>

  <text x="48" y="372" fill="#6b6b63" font-size="15">Wie stark markiert wird, verschiebt sich im Lauf des Lebens.</text>

  <line x1="48" y1="388" x2="572" y2="388" stroke="#f0eee7" stroke-width="1"/>
  <text x="48" y="408" fill="#6b6b63" font-size="15">Schematische Darstellung. Anzahl und Lage der Punkte sind nicht maßstäblich.</text>
</svg>
