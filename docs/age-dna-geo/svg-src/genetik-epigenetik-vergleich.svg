<svg xmlns="http://www.w3.org/2000/svg" width="620" height="390" viewBox="0 0 620 390" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Vergleich der genetischen und der epigenetischen Ebene in vier Zeilen: was gemessen wird, ob es sich verändert, ob es für alle Gewebe gilt und wofür es taugt.">
  <rect width="620" height="390" fill="#f7f4ee"/>
  <rect x="20" y="20" width="580" height="350" rx="14" fill="#ffffff" stroke="#e7e3db"/>

  <text x="48" y="60" fill="#6b6b63" font-size="15" font-weight="500" letter-spacing="1.6">WAS DIE BEIDEN EBENEN UNTERSCHEIDET</text>
  <text x="48" y="96" fill="#26251e" font-size="26" font-weight="400" letter-spacing="-0.3">Zwei Ebenen, vier Unterschiede</text>
  <line x1="48" y1="116" x2="572" y2="116" stroke="#eceae3" stroke-width="1"/>

  <rect x="370" y="128" width="202" height="228" rx="10" fill="#f7f4ee"/>

  <text x="180" y="150" fill="#26251e" font-size="16" font-weight="500">Genetisch</text>
  <text x="382" y="150" fill="#26251e" font-size="16" font-weight="500">Epigenetisch</text>
  <line x1="48" y1="164" x2="572" y2="164" stroke="#eceae3" stroke-width="1"/>

  <text x="48" y="194" fill="#6b6b63" font-size="15">Gemessen wird</text>
  <text x="180" y="194" fill="#26251e" font-size="15">Variante an einer Stelle</text>
  <text x="382" y="194" fill="#26251e" font-size="15">Stärke der Markierung</text>
  <line x1="48" y1="212" x2="572" y2="212" stroke="#f0eee7" stroke-width="1"/>

  <text x="48" y="242" fill="#6b6b63" font-size="15">Verändert sich?</text>
  <text x="180" y="242" fill="#26251e" font-size="15">Nein, bleibt gleich</text>
  <text x="382" y="242" fill="#26251e" font-size="15">Ja, im Lauf des Lebens</text>
  <line x1="48" y1="260" x2="572" y2="260" stroke="#f0eee7" stroke-width="1"/>

  <text x="48" y="290" fill="#6b6b63" font-size="15">Alle Gewebe?</text>
  <text x="180" y="290" fill="#26251e" font-size="15">Ja, überall gleich</text>
  <text x="382" y="290" fill="#26251e" font-size="15">Nein, je nach Gewebe</text>
  <line x1="48" y1="308" x2="572" y2="308" stroke="#f0eee7" stroke-width="1"/>

  <text x="48" y="338" fill="#6b6b63" font-size="15">Taugt für</text>
  <text x="180" y="338" fill="#26251e" font-size="15">Kontext, einmal klären</text>
  <text x="382" y="338" fill="#26251e" font-size="15">Verlauf über die Zeit</text>
</svg>
