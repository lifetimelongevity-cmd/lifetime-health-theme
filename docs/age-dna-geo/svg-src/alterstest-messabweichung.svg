<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#f7f4ee"/>
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="#ffffff" stroke="#e7e3db"/>
  <text x="90" y="118" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">DIESELBE PROBE, ZWEIMAL GEMESSEN</text>
  <text x="90" y="172" fill="#26251e" font-size="40" font-weight="400" letter-spacing="-0.5">Wie weit zwei Messungen auseinanderliegen</text>
  <line x1="90" y1="212" x2="1110" y2="212" stroke="#eceae3" stroke-width="1"/>

  <!-- Massstab: 9 Jahre entsprechen 700 px, also 77,78 px je Jahr -->
  <text x="90" y="268" fill="#26251e" font-size="19" font-weight="500">Uhren in ihrer ursprünglichen Form</text>
  <rect x="90" y="284" width="700" height="52" rx="12" fill="#4a8c85"/>
  <text x="810" y="318" fill="#26251e" font-size="30" font-weight="500">bis zu 9 Jahre</text>
  <text x="90" y="366" fill="#6b6b63" font-size="17">Abweichung zwischen Wiederholungsmessungen, ohne dass sich an der Person etwas geändert hat</text>

  <text x="90" y="424" fill="#26251e" font-size="19" font-weight="500">Dieselben Uhren, auf Hauptkomponenten umgerechnet</text>
  <rect x="90" y="440" width="117" height="52" rx="12" fill="#a8cfc9"/>
  <text x="227" y="474" fill="#26251e" font-size="30" font-weight="500">etwa 1,5 Jahre</text>
  <text x="90" y="522" fill="#6b6b63" font-size="17">In dieser Spanne stimmen die meisten Wiederholungsmessungen überein</text>

  <line x1="90" y1="558" x2="1110" y2="558" stroke="#f0eee7" stroke-width="1"/>
  <text x="90" y="590" fill="#6b6b63" font-size="16">Balken massstäblich. Untersucht wurden sechs verbreitete epigenetische Uhren auf ihre Test-Retest-Reliabilität.</text>
  <text x="90" y="618" fill="#26251e" font-size="16" font-weight="500">Quelle: Higgins-Chen et al., Nature Aging, 2022. doi:10.1038/s43587-022-00248-2</text>
</svg>
