<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero-Motiv Vergleich</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; background: #f7f7f4; color: #26251e; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-weight: 400; font-size: 24px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; opacity: .6; font-size: 15px; }
  .grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .grid { grid-template-columns: 1fr 1fr; } }
  figure { margin: 0; }
  img { width: 100%; display: block; border-radius: 20px; }
  figcaption { font-size: 14px; margin-top: 8px; }
  figcaption b { font-weight: 600; }
  figcaption span { display: block; opacity: .6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hero-Motiv, vier Kandidaten</h1>
  <p class="sub">Gleiche App-Karten (49 / 42), nur das Foto wechselt. Stand 22.10.2026.</p>
  <div class="grid">
    <figure><img src="entwurf-startseite-hero.webp" alt=""><figcaption><b>A · Läuferin, Anfang 50</b><span>Live-Motiv seit 09.10., KI-Bild ki-bewegung-b2</span></figcaption></figure>
    <figure><img src="entwurf-startseite-hero-freundinnen.webp" alt=""><figcaption><b>B · Zwei Freundinnen, um 50</b><span>Foto freundinnen-spaziergang</span></figcaption></figure>
    <figure><img src="entwurf-startseite-hero-paar.webp" alt=""><figcaption><b>C · Paar, um 55</b><span>Foto sport-laufen-paar</span></figcaption></figure>
    <figure><img src="entwurf-startseite-hero-kueche.webp" alt=""><figcaption><b>D · Frau im Alltag, um 45</b><span>Foto kueche-frau</span></figcaption></figure>
  </div>
</div>
</body>
</html>
