<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#f7f4ee"/>
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="#ffffff" stroke="#e7e3db"/>
  <text x="90" y="118" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">STUDIEN AM MENSCHEN</text>
  <text x="90" y="172" fill="#26251e" font-size="40" font-weight="400" letter-spacing="-0.5">Was die Untersuchungen ergeben haben</text>
  <line x1="90" y1="212" x2="1110" y2="212" stroke="#eceae3" stroke-width="1"/>

  <rect x="90" y="252" width="500" height="160" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <text x="122" y="292" fill="#6b6b63" font-size="17">2012 · Cell Metabolism</text>
  <text x="122" y="332" fill="#26251e" font-size="23" font-weight="500">75 mg über 12 Wochen</text>
  <text x="122" y="372" fill="#6b6b63" font-size="18">Kein Effekt auf Stoffwechsel, Blutfette</text>
  <text x="122" y="396" fill="#6b6b63" font-size="18">und Insulinempfindlichkeit</text>

  <rect x="610" y="252" width="500" height="160" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <text x="642" y="292" fill="#6b6b63" font-size="17">2013 · Diabetes</text>
  <text x="642" y="332" fill="#26251e" font-size="23" font-weight="500">Hochdosiert über 4 Wochen</text>
  <text x="642" y="372" fill="#6b6b63" font-size="18">Kein Effekt bei 24 adipösen Männern,</text>
  <text x="642" y="396" fill="#6b6b63" font-size="18">auch nicht auf Blutdruck</text>

  <rect x="90" y="432" width="500" height="160" rx="14" fill="#f2f8f6" stroke="#d6e7e2"/>
  <text x="122" y="472" fill="#6b6b63" font-size="17">2013 · Journal of Physiology</text>
  <text x="122" y="512" fill="#26251e" font-size="23" font-weight="500">250 mg über 8 Wochen</text>
  <text x="122" y="552" fill="#6b6b63" font-size="18">Trainingseffekte fielen geringer aus</text>
  <text x="122" y="576" fill="#6b6b63" font-size="18">als unter Placebo</text>

  <rect x="610" y="432" width="500" height="160" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <text x="642" y="472" fill="#6b6b63" font-size="17">2014 · JAMA Internal Medicine</text>
  <text x="642" y="512" fill="#26251e" font-size="23" font-weight="500">783 Personen, 9 Jahre</text>
  <text x="642" y="552" fill="#6b6b63" font-size="18">Kein Zusammenhang zwischen Zufuhr</text>
  <text x="642" y="576" fill="#6b6b63" font-size="18">und Sterblichkeit</text>
</svg>
