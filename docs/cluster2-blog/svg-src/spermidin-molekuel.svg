<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#f7f4ee"/>
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="#ffffff" stroke="#e7e3db"/>
  <text x="90" y="118" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">BIOCHEMIE</text>
  <text x="90" y="172" fill="#26251e" font-size="40" font-weight="400" letter-spacing="-0.5">Spermidin, ein Polyamin mit drei Stickstoffgruppen</text>
  <line x1="90" y1="212" x2="1110" y2="212" stroke="#eceae3" stroke-width="1"/>

  <text x="405" y="278" fill="#26251e" font-size="20" text-anchor="middle">(CH₂)₃</text>
  <text x="795" y="278" fill="#26251e" font-size="20" text-anchor="middle">(CH₂)₄</text>
  <line x1="236" y1="300" x2="574" y2="300" stroke="#4a8c85" stroke-width="3"/>
  <line x1="626" y1="300" x2="964" y2="300" stroke="#4a8c85" stroke-width="3"/>
  <circle cx="210" cy="300" r="26" fill="#f2f8f6" stroke="#4a8c85" stroke-width="2"/>
  <circle cx="600" cy="300" r="26" fill="#f2f8f6" stroke="#4a8c85" stroke-width="2"/>
  <circle cx="990" cy="300" r="26" fill="#f2f8f6" stroke="#4a8c85" stroke-width="2"/>
  <text x="210" y="308" fill="#26251e" font-size="22" font-weight="500" text-anchor="middle">N</text>
  <text x="600" y="308" fill="#26251e" font-size="22" font-weight="500" text-anchor="middle">N</text>
  <text x="990" y="308" fill="#26251e" font-size="22" font-weight="500" text-anchor="middle">N</text>
  <text x="210" y="358" fill="#6b6b63" font-size="19" text-anchor="middle">H₂N</text>
  <text x="600" y="358" fill="#6b6b63" font-size="19" text-anchor="middle">NH</text>
  <text x="990" y="358" fill="#6b6b63" font-size="19" text-anchor="middle">NH₂</text>

  <line x1="90" y1="400" x2="1110" y2="400" stroke="#eceae3" stroke-width="1"/>

  <rect x="90" y="430" width="326" height="120" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <text x="122" y="470" fill="#6b6b63" font-size="17">Summenformel</text>
  <text x="122" y="514" fill="#26251e" font-size="26" font-weight="500">C₇H₁₉N₃</text>

  <rect x="437" y="430" width="326" height="120" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <text x="469" y="470" fill="#6b6b63" font-size="17">Molmasse</text>
  <text x="469" y="514" fill="#26251e" font-size="26" font-weight="500">145,25 g/mol</text>

  <rect x="784" y="430" width="326" height="120" rx="14" fill="#f2f8f6" stroke="#d6e7e2"/>
  <text x="816" y="470" fill="#6b6b63" font-size="17">Vorkommen</text>
  <text x="816" y="507" fill="#26251e" font-size="22" font-weight="500">Praktisch jede</text>
  <text x="816" y="535" fill="#26251e" font-size="22" font-weight="500">Körperzelle</text>

  <text x="90" y="592" fill="#26251e" font-size="19">Der Körper bildet Spermidin selbst, über pflanzliche Lebensmittel kommt weiteres dazu.</text>
  <text x="90" y="618" fill="#6b6b63" font-size="16">Darstellung des Moleküls. Keine Aussage über eine Wirkung beim Menschen.</text>
</svg>
