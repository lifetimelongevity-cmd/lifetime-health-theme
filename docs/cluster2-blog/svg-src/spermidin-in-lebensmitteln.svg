<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#f7f4ee"/>
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="#ffffff" stroke="#e7e3db"/>
  <text x="90" y="118" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">NATÜRLICHES VORKOMMEN</text>
  <text x="90" y="172" fill="#26251e" font-size="40" font-weight="400" letter-spacing="-0.5">Gemessener Spermidingehalt je 100 g Lebensmittel</text>
  <line x1="90" y1="212" x2="1110" y2="212" stroke="#eceae3" stroke-width="1"/>

  <rect x="90" y="262" width="320" height="248" rx="14" fill="#f2f8f6" stroke="#d6e7e2"/>
  <rect x="122" y="294" width="52" height="6" rx="3" fill="#4a8c85"/>
  <text x="122" y="356" fill="#26251e" font-size="32" font-weight="500">35 und 21 mg</text>
  <text x="122" y="404" fill="#26251e" font-size="19">Weizenkeime,</text>
  <text x="122" y="430" fill="#26251e" font-size="19">Sojabohnen</text>
  <text x="122" y="472" fill="#6b6b63" font-size="17">höchste gemessene Werte</text>

  <rect x="440" y="262" width="320" height="248" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <rect x="472" y="294" width="52" height="6" rx="3" fill="#4a8c85"/>
  <text x="472" y="356" fill="#26251e" font-size="32" font-weight="500">0,1 bis 5,8 mg</text>
  <text x="472" y="404" fill="#26251e" font-size="19">Gemüse, Pilze, Nüsse,</text>
  <text x="472" y="430" fill="#26251e" font-size="19">gereifter Käse</text>
  <text x="472" y="472" fill="#6b6b63" font-size="17">mittlerer Bereich</text>

  <rect x="790" y="262" width="320" height="248" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <rect x="822" y="294" width="52" height="6" rx="3" fill="#4a8c85"/>
  <text x="822" y="356" fill="#26251e" font-size="32" font-weight="500">bis 1,4 mg</text>
  <text x="822" y="404" fill="#26251e" font-size="19">Frisches Fleisch, Milch,</text>
  <text x="822" y="430" fill="#26251e" font-size="19">Joghurt, Obst</text>
  <text x="822" y="472" fill="#6b6b63" font-size="17">niedrigste gemessene Werte</text>

  <line x1="90" y1="546" x2="1110" y2="546" stroke="#f0eee7" stroke-width="1"/>
  <text x="90" y="580" fill="#6b6b63" font-size="16">Messwerte aus Muñoz-Esparza et al., Frontiers in Nutrition 2019, umgerechnet aus nmol/g mit 145,25 g/mol.</text>
  <text x="90" y="606" fill="#6b6b63" font-size="16">Beschreibt den natürlichen Gehalt eines Stoffs, keine Aussage über eine Wirkung.</text>
</svg>
