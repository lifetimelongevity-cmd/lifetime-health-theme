<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#f7f4ee"/>
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="#ffffff" stroke="#e7e3db"/>
  <text x="90" y="118" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">BIOCHEMIE</text>
  <text x="90" y="172" fill="#26251e" font-size="40" font-weight="400" letter-spacing="-0.5">Trans-Resveratrol, ein Stilben mit drei OH-Gruppen</text>
  <line x1="90" y1="212" x2="1110" y2="212" stroke="#eceae3" stroke-width="1"/>

  <polygon points="392,310 361,364 299,364 268,310 299,256 361,256" fill="#f5f4f0" stroke="#4a8c85" stroke-width="2.5"/>
  <polygon points="932,310 901,364 839,364 808,310 839,256 901,256" fill="#f5f4f0" stroke="#4a8c85" stroke-width="2.5"/>
  <line x1="400" y1="303" x2="800" y2="303" stroke="#4a8c85" stroke-width="2.5"/>
  <line x1="400" y1="317" x2="800" y2="317" stroke="#4a8c85" stroke-width="2.5"/>
  <text x="600" y="278" fill="#26251e" font-size="19" text-anchor="middle">Doppelbindung, trans-Form</text>

  <line x1="268" y1="310" x2="228" y2="310" stroke="#6b6b63" stroke-width="2"/>
  <text x="220" y="316" fill="#26251e" font-size="20" text-anchor="end">HO</text>
  <line x1="299" y1="364" x2="299" y2="400" stroke="#6b6b63" stroke-width="2"/>
  <text x="299" y="424" fill="#26251e" font-size="20" text-anchor="middle">OH</text>
  <line x1="932" y1="310" x2="972" y2="310" stroke="#6b6b63" stroke-width="2"/>
  <text x="980" y="316" fill="#26251e" font-size="20">OH</text>

  <line x1="90" y1="466" x2="1110" y2="466" stroke="#eceae3" stroke-width="1"/>

  <rect x="90" y="496" width="326" height="104" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <text x="122" y="532" fill="#6b6b63" font-size="17">Summenformel</text>
  <text x="122" y="572" fill="#26251e" font-size="24" font-weight="500">C₁₄H₁₂O₃</text>

  <rect x="437" y="496" width="326" height="104" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <text x="469" y="532" fill="#6b6b63" font-size="17">Molmasse</text>
  <text x="469" y="572" fill="#26251e" font-size="24" font-weight="500">228,25 g/mol</text>

  <rect x="784" y="496" width="326" height="104" rx="14" fill="#f2f8f6" stroke="#d6e7e2"/>
  <text x="816" y="532" fill="#6b6b63" font-size="17">Stoffgruppe</text>
  <text x="816" y="572" fill="#26251e" font-size="24" font-weight="500">Polyphenol, Stilben</text>

  <text x="90" y="628" fill="#6b6b63" font-size="16">Darstellung des Moleküls, chemisch 3,5,4'-Trihydroxystilben. Keine Aussage über eine Wirkung beim Menschen.</text>
</svg>
