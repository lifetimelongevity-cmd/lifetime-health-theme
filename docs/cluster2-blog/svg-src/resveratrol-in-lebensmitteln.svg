<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#f7f4ee"/>
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="#ffffff" stroke="#e7e3db"/>
  <text x="90" y="118" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">NATÜRLICHES VORKOMMEN</text>
  <text x="90" y="172" fill="#26251e" font-size="40" font-weight="400" letter-spacing="-0.5">Gemessenes Resveratrol in Lebensmitteln</text>
  <line x1="90" y1="212" x2="1110" y2="212" stroke="#eceae3" stroke-width="1"/>

  <rect x="90" y="262" width="320" height="248" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <rect x="122" y="294" width="52" height="6" rx="3" fill="#4a8c85"/>
  <text x="122" y="356" fill="#26251e" font-size="32" font-weight="500">1,9 mg/Liter</text>
  <text x="122" y="404" fill="#26251e" font-size="19">Rotwein</text>
  <text x="122" y="446" fill="#6b6b63" font-size="17">Spannweite 0,4 bis 2,0,</text>
  <text x="122" y="472" fill="#6b6b63" font-size="17">Weißwein liegt darunter</text>

  <rect x="440" y="262" width="320" height="248" rx="14" fill="#f5f4f0" stroke="#e7e3db"/>
  <rect x="472" y="294" width="52" height="6" rx="3" fill="#4a8c85"/>
  <text x="472" y="356" fill="#26251e" font-size="32" font-weight="500">0,09 bis 1,6</text>
  <text x="472" y="390" fill="#26251e" font-size="24" font-weight="500">mg/Kilogramm</text>
  <text x="472" y="432" fill="#26251e" font-size="19">Rote Trauben</text>
  <text x="472" y="472" fill="#6b6b63" font-size="17">bezogen auf Frischgewicht</text>

  <rect x="790" y="262" width="320" height="248" rx="14" fill="#f2f8f6" stroke="#d6e7e2"/>
  <rect x="822" y="294" width="52" height="6" rx="3" fill="#4a8c85"/>
  <text x="822" y="356" fill="#26251e" font-size="32" font-weight="500">0,2 mg/Tag</text>
  <text x="822" y="404" fill="#26251e" font-size="19">Aufnahme im Alltag</text>
  <text x="822" y="446" fill="#6b6b63" font-size="17">gerechnet auf 31,7 Liter</text>
  <text x="822" y="472" fill="#6b6b63" font-size="17">Rotwein im Jahr</text>

  <line x1="90" y1="546" x2="1110" y2="546" stroke="#f0eee7" stroke-width="1"/>
  <text x="90" y="580" fill="#6b6b63" font-size="16">Messwerte und Beispielrechnung aus Weiskirchen und Weiskirchen, Advances in Nutrition 2016.</text>
  <text x="90" y="606" fill="#6b6b63" font-size="16">Beschreibt den natürlichen Gehalt eines Stoffs, keine Aussage über eine Wirkung.</text>
</svg>
