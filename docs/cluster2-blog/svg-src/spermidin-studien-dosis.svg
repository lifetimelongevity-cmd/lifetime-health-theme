  <text x="901" y="530" fill="#6b6b63" font-size="16" text-anchor="middle">30</text>
  <text x="1059" y="530" fill="#6b6b63" font-size="16" text-anchor="middle">40 mg pro Tag</text>

  <line x1="90" y1="556" x2="1110" y2="556" stroke="#f0eee7" stroke-width="1"/>
  <text x="90" y="588" fill="#26251e" font-size="19">Die beiden Gedächtnisstudien dosierten unter dem, was eine normale Mischkost liefert.</text>
  <text x="90" y="614" fill="#6b6b63" font-size="16">Angaben zu Studiendesigns. Keine Verzehrempfehlung und keine Aussage über eine Wirkung.</text>
