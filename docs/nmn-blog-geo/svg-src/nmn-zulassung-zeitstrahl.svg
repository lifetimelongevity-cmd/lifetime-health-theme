<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#f7f4ee"/>
  <rect x="40" y="40" width="1120" height="595" rx="16" fill="#ffffff" stroke="#e7e3db"/>
  <text x="90" y="118" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">STAND 12. OKTOBER 2026</text>
  <text x="90" y="172" fill="#26251e" font-size="40" font-weight="400" letter-spacing="-0.5">Der Weg zur NMN-Zulassung</text>
  <line x1="90" y1="212" x2="1110" y2="212" stroke="#eceae3" stroke-width="1"/>

  <!-- connector: solid teal bis zur Ausschusssitzung, gestrichelt danach -->
  <line x1="150" y1="352" x2="690" y2="352" stroke="#4a8c85" stroke-width="2"/>
  <line x1="690" y1="352" x2="1050" y2="352" stroke="#d8d4ca" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- marker: heute -->
  <g>
    <text x="780" y="270" fill="#26251e" font-size="19" font-weight="500" text-anchor="middle">heute</text>
    <path d="M780 284 l-9 -13 l18 0 z" fill="#26251e"/>
  </g>

  <!-- 1 Antrag: erledigt -->
  <g>
    <circle cx="150" cy="352" r="28" fill="#4a8c85"/>
    <path d="M138 352 l8 9 l15 -17" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="424" fill="#26251e" font-size="21" font-weight="500" text-anchor="middle">Antrag</text>
    <text x="150" y="452" fill="#4a8c85" font-size="17" font-weight="500" text-anchor="middle">2. Aug. 2023</text>
    <text x="150" y="478" fill="#8a8a80" font-size="16" text-anchor="middle">EffePharm</text>
  </g>
  <!-- 2 EFSA: erledigt -->
  <g>
    <circle cx="330" cy="352" r="28" fill="#4a8c85"/>
    <path d="M318 352 l8 9 l15 -17" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="424" fill="#26251e" font-size="21" font-weight="500" text-anchor="middle">EFSA-Gutachten</text>
    <text x="330" y="452" fill="#4a8c85" font-size="17" font-weight="500" text-anchor="middle">4. M&#228;rz 2026</text>
    <text x="330" y="478" fill="#8a8a80" font-size="16" text-anchor="middle">positiv, bis 300 mg/Tag</text>
  </g>
  <!-- 3 Entwurf: erledigt -->
  <g>
    <circle cx="510" cy="352" r="28" fill="#4a8c85"/>
    <path d="M498 352 l8 9 l15 -17" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="424" fill="#26251e" font-size="21" font-weight="500" text-anchor="middle">Entwurf</text>
    <text x="510" y="452" fill="#4a8c85" font-size="17" font-weight="500" text-anchor="middle">11. Sep. 2026</text>
    <text x="510" y="478" fill="#8a8a80" font-size="16" text-anchor="middle">an den Ausschuss</text>
  </g>
  <!-- 4 Ausschuss: zugestimmt -->
  <g>
    <circle cx="690" cy="352" r="28" fill="#4a8c85"/>
    <path d="M678 352 l8 9 l15 -17" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="690" y="424" fill="#26251e" font-size="21" font-weight="500" text-anchor="middle">Ausschuss</text>
    <text x="690" y="452" fill="#4a8c85" font-size="17" font-weight="500" text-anchor="middle">25. Sep. 2026</text>
    <text x="690" y="478" fill="#8a8a80" font-size="16" text-anchor="middle">zugestimmt, 27 von 27</text>
  </g>
  <!-- 5 Amtsblatt: geschaetzt -->
  <g>
    <circle cx="870" cy="352" r="28" fill="#f2f1ed" stroke="#cfccc3" stroke-width="2"/>
    <text x="870" y="361" fill="#a8a498" font-size="24" font-weight="500" text-anchor="middle">5</text>
    <text x="870" y="424" fill="#8a8a80" font-size="21" font-weight="500" text-anchor="middle">Amtsblatt</text>
    <text x="870" y="452" fill="#a8a498" font-size="17" text-anchor="middle">etwa Ende Nov.</text>
    <text x="870" y="478" fill="#a8a498" font-size="16" text-anchor="middle">gesch&#228;tzt</text>
  </g>
  <!-- 6 In Kraft: geschaetzt -->
  <g>
    <circle cx="1050" cy="352" r="28" fill="#f2f1ed" stroke="#cfccc3" stroke-width="2"/>
    <text x="1050" y="361" fill="#a8a498" font-size="24" font-weight="500" text-anchor="middle">6</text>
    <text x="1050" y="424" fill="#8a8a80" font-size="21" font-weight="500" text-anchor="middle">In Kraft</text>
    <text x="1050" y="452" fill="#a8a498" font-size="17" text-anchor="middle">etwa Mitte Dez.</text>
    <text x="1050" y="478" fill="#a8a498" font-size="16" text-anchor="middle">20 Tage danach</text>
  </g>

  <line x1="90" y1="536" x2="1110" y2="536" stroke="#f0eee7" stroke-width="1"/>
  <text x="90" y="580" fill="#6b6b63" font-size="18">Schritte 5 und 6 gesch&#228;tzt nach dem Tempo vergleichbarer F&#228;lle. Bis zum Inkrafttreten</text>
  <text x="90" y="606" fill="#6b6b63" font-size="18">der Verordnung ist NMN in der EU nicht zugelassen.</text>
</svg>
