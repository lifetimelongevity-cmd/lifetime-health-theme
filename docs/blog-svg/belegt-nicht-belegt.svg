<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="640" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="584" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Belegt und nicht belegt</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Zwei Aussagen, die regelm&#228;&#223;ig vermischt werden</text>
<line x1="64" y1="172" x2="836" y2="172" stroke="#eceae3" stroke-width="1"/>
<rect x="64.0" y="214" width="376.0" height="246" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="86.0" y="260" fill="#26251e" font-size="30" font-weight="500">Belegt</text>
<text x="86.0" y="300" fill="#6b6b63" font-size="24" font-weight="400">Einzelne Messwerte lassen</text>
<text x="86.0" y="332" fill="#6b6b63" font-size="24" font-weight="400">sich verschieben.</text>
<text x="86.0" y="364" fill="#4a8c85" font-size="24" font-weight="500">Ein Methylierungsmuster</text>
<text x="86.0" y="396" fill="#4a8c85" font-size="24" font-weight="500">wird dem einer j&#252;ngeren</text>
<text x="86.0" y="428" fill="#4a8c85" font-size="24" font-weight="500">Vergleichsgruppe &#228;hnlicher</text>
<rect x="460.0" y="214" width="376.0" height="246" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="482.0" y="260" fill="#26251e" font-size="30" font-weight="500">Nicht belegt</text>
<text x="482.0" y="300" fill="#6b6b63" font-size="24" font-weight="400">Dass damit ein</text>
<text x="482.0" y="332" fill="#6b6b63" font-size="24" font-weight="400">biologischer Prozess</text>
<text x="482.0" y="364" fill="#6b6b63" font-size="24" font-weight="400">zur&#252;ckgesetzt wird.</text>
<text x="482.0" y="396" fill="#4a8c85" font-size="24" font-weight="500">Gewebe oder Organe werden</text>
<text x="482.0" y="428" fill="#4a8c85" font-size="24" font-weight="500">dadurch nicht j&#252;nger.</text>
<line x1="64" y1="496.0" x2="836" y2="496.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="530.0" fill="#26251e" font-size="23" font-weight="400">Aufhalten l&#228;sst sich der Prozess nach heutigem Stand nicht.</text>
<text x="64" y="560.0" fill="#6b6b63" font-size="21" font-weight="400">Verlangsamen ist die offene Frage, und die Belegslage beim Menschen</text>
<text x="64" y="590.0" fill="#6b6b63" font-size="21" font-weight="400">ist d&#252;nn.</text>
</svg>