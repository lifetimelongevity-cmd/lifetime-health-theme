<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="710" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="654" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Der Weg deiner Probe</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Mindestens drei Stellen arbeiten daran, bevor du ein</text>
<text x="64" y="172" fill="#6b6b63" font-size="24" font-weight="400">Ergebnis siehst</text>
<line x1="64" y1="202" x2="836" y2="202" stroke="#eceae3" stroke-width="1"/>
<rect x="64" y="244" width="232" height="170" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="84" y="296" fill="#26251e" font-size="27" font-weight="500">Labor</text>
<text x="84" y="334" fill="#6b6b63" font-size="21" font-weight="400">extrahiert die</text>
<text x="84" y="360" fill="#6b6b63" font-size="21" font-weight="400">DNA und misst sie</text>
<line x1="300" y1="329.0" x2="334" y2="329.0" stroke="#4a8c85" stroke-width="3"/><path d="M334 321.0 l14 8 -14 8 z" fill="#4a8c85"/>
<rect x="338" y="244" width="232" height="170" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="358" y="296" fill="#26251e" font-size="27" font-weight="500">Auswertung</text>
<text x="358" y="334" fill="#6b6b63" font-size="21" font-weight="400">rechnet aus den</text>
<text x="358" y="360" fill="#6b6b63" font-size="21" font-weight="400">Messwerten</text>
<text x="358" y="386" fill="#6b6b63" font-size="21" font-weight="400">Ergebnisse</text>
<line x1="574" y1="329.0" x2="608" y2="329.0" stroke="#4a8c85" stroke-width="3"/><path d="M608 321.0 l14 8 -14 8 z" fill="#4a8c85"/>
<rect x="612" y="244" width="232" height="170" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="632" y="296" fill="#26251e" font-size="27" font-weight="500">Anwendung</text>
<text x="632" y="334" fill="#6b6b63" font-size="21" font-weight="400">zeigt das</text>
<text x="632" y="360" fill="#6b6b63" font-size="21" font-weight="400">Ergebnis und</text>
<text x="632" y="386" fill="#6b6b63" font-size="21" font-weight="400">speichert es</text>
<rect x="64" y="448" width="772" height="86" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="88" y="488" fill="#26251e" font-size="25" font-weight="500">Pseudonymisiert unter einer individuellen ID.</text>
<text x="88" y="518" fill="#6b6b63" font-size="21" font-weight="400">Das Labor bekommt keinen Namen.</text>
<line x1="64" y1="570.0" x2="836" y2="570.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="604.0" fill="#26251e" font-size="23" font-weight="400">Ein Anbieter kann zusagen, dass der Kreis klein bleibt. Nicht,</text>
<text x="64" y="634.0" fill="#26251e" font-size="23" font-weight="400">dass er leer ist.</text>
<text x="64" y="664.0" fill="#6b6b63" font-size="21" font-weight="400">Allgemeine Einordnung des Verfahrens, keine Rechtsberatung.</text>
</svg>