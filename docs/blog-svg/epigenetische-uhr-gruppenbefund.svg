<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="620" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="564" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Was die Abweichung in Gruppen bedeutet</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Vier L&#228;ngsschnittkohorten, je f&#252;nf Jahre h&#246;here Abweichung</text>
<line x1="64" y1="172" x2="836" y2="172" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="245.0" fill="#26251e" font-size="23" font-weight="400">ohne weitere Korrektur</text>
<rect x="354" y="214" width="280" height="44" rx="22.0" fill="#f5f4f0" stroke="#e7e3db"/>
<rect x="354" y="214" width="235.2" height="44" rx="22.0" fill="#4a8c85"/>
<text x="836" y="245.0" fill="#26251e" font-size="24" font-weight="500" text-anchor="end">+21 %</text>
<text x="64" y="311.0" fill="#26251e" font-size="23" font-weight="400">nach Korrektur</text>
<rect x="354" y="280" width="280" height="44" rx="22.0" fill="#f5f4f0" stroke="#e7e3db"/>
<rect x="354" y="280" width="179.20000000000002" height="44" rx="22.0" fill="#c6cbc7"/>
<text x="836" y="311.0" fill="#26251e" font-size="24" font-weight="500" text-anchor="end">+16 %</text>
<text x="64" y="376" fill="#26251e" font-size="24" font-weight="400">H&#246;heres Sterberisiko im Beobachtungszeitraum. Korrigiert wurde</text>
<text x="64" y="408" fill="#26251e" font-size="24" font-weight="400">um Bildung, soziale Lage, Bluthochdruck, Diabetes und weitere</text>
<text x="64" y="440" fill="#26251e" font-size="24" font-weight="400">Faktoren.</text>
<line x1="64" y1="476.0" x2="836" y2="476.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="510.0" fill="#26251e" font-size="23" font-weight="400">Marioni et al., Genome Biology 2015.</text>
<text x="64" y="540.0" fill="#6b6b63" font-size="21" font-weight="400">Statistischer Zusammenhang in gro&#223;en Gruppen, f&#252;r eine Person keine</text>
<text x="64" y="570.0" fill="#6b6b63" font-size="21" font-weight="400">Prognose.</text>
