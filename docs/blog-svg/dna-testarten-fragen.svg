<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="590" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="534" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Welche Frage passt zu welchem Typ</text>
<line x1="64" y1="146" x2="836" y2="146" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="188" fill="#26251e" font-size="26" font-weight="500">Woher komme ich?</text>
<text x="836" y="188" fill="#4a8c85" font-size="26" font-weight="500" text-anchor="end">Abstammungstest</text>
<line x1="64" y1="214" x2="836" y2="214" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="264" fill="#26251e" font-size="26" font-weight="500">Wie ticke ich, dauerhaft?</text>
<text x="836" y="264" fill="#4a8c85" font-size="26" font-weight="500" text-anchor="end">Veranlagungstest</text>
<line x1="64" y1="290" x2="836" y2="290" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="340" fill="#26251e" font-size="26" font-weight="500">Wo stehe ich gerade?</text>
<text x="836" y="340" fill="#4a8c85" font-size="26" font-weight="500" text-anchor="end">Epigenetischer Test</text>
<line x1="64" y1="366" x2="836" y2="366" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="416" fill="#26251e" font-size="26" font-weight="500">Habe ich ein Problem?</text>
<text x="836" y="416" fill="#4a8c85" font-size="26" font-weight="500" text-anchor="end">&#196;rztliche Abkl&#228;rung</text>
<line x1="64" y1="452.0" x2="836" y2="452.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="486.0" fill="#26251e" font-size="23" font-weight="400">Der h&#228;ufigste Fehlkauf ist ein Test f&#252;r eine Frage, die er</text>
<text x="64" y="516.0" fill="#26251e" font-size="23" font-weight="400">nicht beantwortet.</text>
<text x="64" y="546.0" fill="#6b6b63" font-size="21" font-weight="400">Zuerst die Frage kl&#228;ren, danach den Typ.</text>
</svg>