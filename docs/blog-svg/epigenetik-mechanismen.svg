<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="700" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="644" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Zwei Mechanismen</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Beide &#228;ndern den Text der Gene nicht, sondern das Ablesen</text>
<line x1="64" y1="172" x2="836" y2="172" stroke="#eceae3" stroke-width="1"/>
<rect x="64.0" y="214" width="376.0" height="256" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="86.0" y="260" fill="#26251e" font-size="30" font-weight="500">DNA-Methylierung</text>
<text x="86.0" y="300" fill="#6b6b63" font-size="24" font-weight="400">Eine Methylgruppe setzt</text>
<text x="86.0" y="332" fill="#6b6b63" font-size="24" font-weight="400">sich an die DNA, bevorzugt</text>
<text x="86.0" y="364" fill="#6b6b63" font-size="24" font-weight="400">wo ein C vor einem G steht</text>
<text x="86.0" y="396" fill="#4a8c85" font-size="24" font-weight="500">In der Steuerregion eines</text>
<text x="86.0" y="428" fill="#4a8c85" font-size="24" font-weight="500">Gens: schw&#228;cher abgelesen</text>
<rect x="460.0" y="214" width="376.0" height="256" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="482.0" y="260" fill="#26251e" font-size="30" font-weight="500">Histon-Verpackung</text>
<text x="482.0" y="300" fill="#6b6b63" font-size="24" font-weight="400">Chemische &#196;nderungen an</text>
<text x="482.0" y="332" fill="#6b6b63" font-size="24" font-weight="400">den Proteinen, um die der</text>
<text x="482.0" y="364" fill="#6b6b63" font-size="24" font-weight="400">DNA-Faden gewickelt ist.</text>
<text x="482.0" y="396" fill="#4a8c85" font-size="24" font-weight="500">Fest verpackt: schlechter</text>
<text x="482.0" y="428" fill="#4a8c85" font-size="24" font-weight="500">zug&#228;nglich zum Ablesen</text>
<text x="64" y="518" fill="#26251e" font-size="25" font-weight="500">Beide Mechanismen sind umkehrbar.</text>
<line x1="64" y1="554.0" x2="836" y2="554.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="588.0" fill="#26251e" font-size="23" font-weight="400">Genau das unterscheidet sie von der DNA-Sequenz.</text>
<text x="64" y="618.0" fill="#6b6b63" font-size="21" font-weight="400">epi hei&#223;t auf Griechisch &#252;ber. Epigenetik ist die Ebene &#252;ber der</text>
<text x="64" y="648.0" fill="#6b6b63" font-size="21" font-weight="400">Genetik.</text>
</svg>