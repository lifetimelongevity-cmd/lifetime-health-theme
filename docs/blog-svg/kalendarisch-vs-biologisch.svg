<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="670" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="614" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Z&#228;hlung und Sch&#228;tzung</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Zwei Altersbegriffe, die methodisch nichts miteinander zu</text>
<text x="64" y="172" fill="#6b6b63" font-size="24" font-weight="400">tun haben</text>
<line x1="64" y1="202" x2="836" y2="202" stroke="#eceae3" stroke-width="1"/>
<rect x="64.0" y="244" width="376.0" height="250" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="86.0" y="290" fill="#26251e" font-size="30" font-weight="500">Kalendarisch</text>
<text x="86.0" y="330" fill="#6b6b63" font-size="24" font-weight="400">z&#228;hlt Jahre seit der</text>
<text x="86.0" y="362" fill="#6b6b63" font-size="24" font-weight="400">Geburt</text>
<text x="86.0" y="394" fill="#4a8c85" font-size="24" font-weight="500">EXAKT</text>
<text x="86.0" y="426" fill="#6b6b63" font-size="24" font-weight="400">f&#252;r alle Menschen gleich</text>
<text x="86.0" y="458" fill="#6b6b63" font-size="24" font-weight="400">definiert</text>
<rect x="460.0" y="244" width="376.0" height="250" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="482.0" y="290" fill="#26251e" font-size="30" font-weight="500">Biologisch</text>
<text x="482.0" y="330" fill="#6b6b63" font-size="24" font-weight="400">sch&#228;tzt aus einem</text>
<text x="482.0" y="362" fill="#6b6b63" font-size="24" font-weight="400">Rechenmodell</text>
<text x="482.0" y="394" fill="#4a8c85" font-size="24" font-weight="500">UNSCHARF</text>
<text x="482.0" y="426" fill="#6b6b63" font-size="24" font-weight="400">verschiedene Modelle,</text>
<text x="482.0" y="458" fill="#6b6b63" font-size="24" font-weight="400">verschiedene Zahlen</text>
<line x1="64" y1="530.0" x2="836" y2="530.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="564.0" fill="#26251e" font-size="23" font-weight="400">Interessant ist der Abstand zwischen beiden und wie er sich</text>
<text x="64" y="594.0" fill="#26251e" font-size="23" font-weight="400">&#252;ber Jahre entwickelt.</text>
<text x="64" y="624.0" fill="#6b6b63" font-size="21" font-weight="400">Keine Aussage &#252;ber die Lebenserwartung.</text>
</svg>