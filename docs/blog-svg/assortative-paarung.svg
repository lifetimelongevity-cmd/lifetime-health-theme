<text x="64" y="566.0" fill="#26251e" font-size="23" font-weight="400">Menschen suchen sich Partner, die ihnen in Herkunft, Bildung</text>
<text x="64" y="596.0" fill="#26251e" font-size="23" font-weight="400">und Gewohnheiten &#228;hneln.</text>
<text x="64" y="626.0" fill="#6b6b63" font-size="21" font-weight="400">Ruby et al., Genetics 2018.</text>
