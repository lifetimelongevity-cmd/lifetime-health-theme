<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Warum die alte Zahl zu hoch war</text>
<line x1="64" y1="146" x2="836" y2="146" stroke="#eceae3" stroke-width="1"/>
<rect x="64" y="188" width="358" height="128" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="86" y="238" fill="#26251e" font-size="27" font-weight="500">Blutsverwandte</text>
<text x="86" y="274" fill="#6b6b63" font-size="21" font-weight="400">teilen Gene und Umst&#228;nde</text>
<rect x="478" y="188" width="358" height="128" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="500" y="238" fill="#26251e" font-size="27" font-weight="500">Angeheiratete</text>
<text x="500" y="274" fill="#6b6b63" font-size="21" font-weight="400">teilen nur die Umst&#228;nde</text>
<line x1="450.0" y1="332" x2="450.0" y2="358" stroke="#4a8c85" stroke-width="3"/><path d="M442.0 358 l8 14 8 -14 z" fill="#4a8c85"/>
