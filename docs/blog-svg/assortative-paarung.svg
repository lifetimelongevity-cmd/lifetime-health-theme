<text x="90" y="430" fill="#26251e" font-size="27" font-weight="500">Beide Gruppen &#228;hneln sich &#228;hnlich stark.</text>
<text x="90" y="466" fill="#6b6b63" font-size="21" font-weight="400">Dann erkl&#228;rt nicht Vererbung die &#196;hnlichkeit, sondern die Partnerwahl.</text>
