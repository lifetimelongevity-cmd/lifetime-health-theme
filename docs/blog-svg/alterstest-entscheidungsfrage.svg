<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="740" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="684" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Die Frage vor dem Kauf</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Der Nutzen entsteht aus der Wiederholung, nicht aus dem</text>
<text x="64" y="172" fill="#6b6b63" font-size="24" font-weight="400">ersten Wert</text>
<line x1="64" y1="202" x2="836" y2="202" stroke="#eceae3" stroke-width="1"/>
<rect x="64" y="244" width="772" height="88" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="90" y="298" fill="#26251e" font-size="29" font-weight="500">Misst du in zwei bis drei Jahren erneut?</text>
<rect x="64.0" y="366" width="376.0" height="196" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="86.0" y="412" fill="#26251e" font-size="30" font-weight="500">Nein</text>
<text x="86.0" y="452" fill="#6b6b63" font-size="24" font-weight="400">Ein Einzelwert bleibt eine</text>
<text x="86.0" y="484" fill="#6b6b63" font-size="24" font-weight="400">Momentaufnahme mit</text>
<text x="86.0" y="516" fill="#6b6b63" font-size="24" font-weight="400">mehreren Jahren</text>
<text x="86.0" y="548" fill="#6b6b63" font-size="24" font-weight="400">Unsicherheit.</text>
<rect x="460.0" y="366" width="376.0" height="196" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="482.0" y="412" fill="#26251e" font-size="30" font-weight="500">Ja</text>
<text x="482.0" y="452" fill="#6b6b63" font-size="24" font-weight="400">Mehrere Punkte unter</text>
<text x="482.0" y="484" fill="#6b6b63" font-size="24" font-weight="400">gleichen Bedingungen</text>
<text x="482.0" y="516" fill="#6b6b63" font-size="24" font-weight="400">ergeben eine</text>
<text x="482.0" y="548" fill="#6b6b63" font-size="24" font-weight="400">Verlaufslinie.</text>
<line x1="64" y1="598.0" x2="836" y2="598.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="632.0" fill="#26251e" font-size="23" font-weight="400">Zwei Punkte ergeben eine Differenz, drei Punkte ergeben eine</text>
<text x="64" y="662.0" fill="#26251e" font-size="23" font-weight="400">Richtung.</text>
<text x="64" y="692.0" fill="#6b6b63" font-size="21" font-weight="400">Entscheidungshilfe, keine medizinische Beratung.</text>
</svg>