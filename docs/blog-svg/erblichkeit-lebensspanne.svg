<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="590" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="534" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Erblichkeit der Lebensspanne</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Was die Korrektur von 2018 ver&#228;ndert hat</text>
<line x1="64" y1="172" x2="836" y2="172" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="245.0" fill="#26251e" font-size="23" font-weight="400">bisherige Sch&#228;tzungen</text>
<rect x="334" y="214" width="300" height="44" rx="22.0" fill="#f5f4f0" stroke="#e7e3db"/>
<rect x="334" y="214" width="300.0" height="44" rx="22.0" fill="#c6cbc7"/>
<text x="836" y="245.0" fill="#26251e" font-size="24" font-weight="500" text-anchor="end">15 bis 30 %</text>
<text x="64" y="311.0" fill="#26251e" font-size="23" font-weight="400">nach Korrektur</text>
<rect x="334" y="280" width="300" height="44" rx="22.0" fill="#f5f4f0" stroke="#e7e3db"/>
<rect x="334" y="280" width="100.0" height="44" rx="22.0" fill="#4a8c85"/>
<text x="836" y="311.0" fill="#26251e" font-size="24" font-weight="500" text-anchor="end">unter 10 %</text>
<text x="64" y="382" fill="#26251e" font-size="24" font-weight="400">Der gr&#246;&#223;te Teil der &#196;hnlichkeit zeigte sich auch zwischen</text>
<text x="64" y="414" fill="#26251e" font-size="24" font-weight="400">angeheirateten Personen, die keine Gene teilen.</text>
<line x1="64" y1="450.0" x2="836" y2="450.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="484.0" fill="#26251e" font-size="23" font-weight="400">Ruby et al., Genetics 2018, Stammbaumdaten hunderter Millionen</text>
<text x="64" y="514.0" fill="#26251e" font-size="23" font-weight="400">Personen.</text>
<text x="64" y="544.0" fill="#6b6b63" font-size="21" font-weight="400">Betrifft die Lebensspanne, nicht ein gemessenes biologisches Alter.</text>
</svg>