<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="610" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="554" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Drei Pr&#252;ffragen an jedes Protokoll</text>
<line x1="64" y1="146" x2="836" y2="146" stroke="#eceae3" stroke-width="1"/>
<text x="482.0" y="188" fill="#26251e" font-size="23" font-weight="500" text-anchor="middle">Selbstversuch</text>
<text x="718.0" y="188" fill="#26251e" font-size="23" font-weight="500" text-anchor="middle">Kontrollierte Studie</text>
<line x1="64" y1="204" x2="836" y2="204" stroke="#e7e3db" stroke-width="1"/>
<text x="64" y="250" fill="#6b6b63" font-size="22" font-weight="400">Vergleichsgruppe</text>
<text x="482.0" y="250" fill="#26251e" font-size="23" font-weight="400" text-anchor="middle">nein</text>
<text x="718.0" y="250" fill="#4a8c85" font-size="23" font-weight="500" text-anchor="middle">ja</text>
<line x1="64" y1="276" x2="836" y2="276" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="312" fill="#6b6b63" font-size="22" font-weight="400">nur eine Sache ver&#228;ndert</text>
<text x="482.0" y="312" fill="#26251e" font-size="23" font-weight="400" text-anchor="middle">nein</text>
<text x="718.0" y="312" fill="#26251e" font-size="23" font-weight="400" text-anchor="middle">nein</text>
<line x1="64" y1="338" x2="836" y2="338" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="374" fill="#6b6b63" font-size="22" font-weight="400">Effekt gr&#246;&#223;er als Streuung</text>
<text x="482.0" y="374" fill="#26251e" font-size="23" font-weight="400" text-anchor="middle">offen</text>
<text x="718.0" y="374" fill="#26251e" font-size="23" font-weight="400" text-anchor="middle">offen</text>
<line x1="64" y1="400" x2="836" y2="400" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="436" fill="#6b6b63" font-size="22" font-weight="400">Reichweite</text>
<text x="482.0" y="436" fill="#26251e" font-size="23" font-weight="400" text-anchor="middle">eine Person</text>
<text x="718.0" y="436" fill="#26251e" font-size="23" font-weight="400" text-anchor="middle">43 M&#228;nner</text>
<line x1="64" y1="472.0" x2="836" y2="472.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="506.0" fill="#26251e" font-size="23" font-weight="400">Aufwand und Belegkraft sind unabh&#228;ngig voneinander.</text>
<text x="64" y="536.0" fill="#6b6b63" font-size="21" font-weight="400">Ein Protokoll wird nicht dadurch besser belegt, dass es teuer oder</text>
<text x="64" y="566.0" fill="#6b6b63" font-size="21" font-weight="400">umfangreich ist.</text>
</svg>