<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="730" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="674" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Drei Aussagen, die zu weit gehen</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Alle drei begegnen einem st&#228;ndig und gehen &#252;ber die</text>
<text x="64" y="172" fill="#6b6b63" font-size="24" font-weight="400">Datenlage hinaus</text>
<line x1="64" y1="202" x2="836" y2="202" stroke="#eceae3" stroke-width="1"/>
<rect x="64" y="244" width="772" height="100" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="90" y="286" fill="#26251e" font-size="25" font-weight="500">Erfahrungen vererben sich epigenetisch</text>
<text x="90" y="318" fill="#6b6b63" font-size="20" font-weight="400">Markierungen werden zwischen den Generationen im Wesentlichen gel&#246;scht</text>
<rect x="64" y="362" width="772" height="100" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="90" y="404" fill="#26251e" font-size="25" font-weight="500">Mit der richtigen Ern&#228;hrung Gene an- und ausschalten</text>
<text x="90" y="436" fill="#6b6b63" font-size="20" font-weight="400">Nahrung beeinflusst Muster, gezielte Steuerung ist nicht belegt</text>
<rect x="64" y="480" width="772" height="100" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="90" y="522" fill="#26251e" font-size="25" font-weight="500">Epigenetik erkl&#228;rt unterschiedliches Altern</text>
<text x="90" y="554" fill="#6b6b63" font-size="20" font-weight="400">Sie erkl&#228;rt einen Teil und liefert vor allem ein Messinstrument</text>
<line x1="64" y1="616.0" x2="836" y2="616.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="650.0" fill="#26251e" font-size="23" font-weight="400">Diese Einschr&#228;nkungen machen das Feld nicht kleiner.</text>
<text x="64" y="680.0" fill="#6b6b63" font-size="21" font-weight="400">Zur Vererbung: Tuscher und Day, Neurobiology of Disease 2019.</text>
</svg>