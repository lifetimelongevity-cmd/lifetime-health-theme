<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="660" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="604" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Wann ein Abstand etwas bedeutet</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Gemessen an der Streuung des Verfahrens</text>
<line x1="64" y1="172" x2="836" y2="172" stroke="#eceae3" stroke-width="1"/>
<rect x="64" y="214" width="772" height="72" rx="10" fill="#f5f4f0" stroke="#e7e3db"/>
<rect x="385.6666666666667" y="214" width="128.66666666666666" height="72" rx="10" fill="#dbe8e4"/>
<line x1="450.0" y1="200" x2="450.0" y2="300" stroke="#4a8c85" stroke-width="3"/>
<text x="450.0" y="188" fill="#4a8c85" font-size="21" font-weight="500" text-anchor="middle">rund 1,5 Jahre</text>
<text x="64" y="332" fill="#6b6b63" font-size="22" font-weight="400">&#8722; 9 Jahre</text>
<text x="450.0" y="332" fill="#6b6b63" font-size="22" font-weight="400" text-anchor="middle">0</text>
<text x="836" y="332" fill="#6b6b63" font-size="22" font-weight="400" text-anchor="end">+ 9 Jahre</text>
<text x="64" y="386" fill="#26251e" font-size="24" font-weight="400">Bis zu neun Jahre Abweichung allein durch technisches Rauschen,</text>
<text x="64" y="418" fill="#26251e" font-size="24" font-weight="400">im g&#252;nstigen Fall rund anderthalb Jahre. Ein Abstand von zwei</text>
<text x="64" y="450" fill="#26251e" font-size="24" font-weight="400">Jahren liegt damit oft noch in der Streuung des Verfahrens.</text>
<line x1="64" y1="486.0" x2="836" y2="486.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="520.0" fill="#26251e" font-size="23" font-weight="400">Higgins-Chen et al., Nature Aging 2022, Wiederholungsmessungen</text>
<text x="64" y="550.0" fill="#26251e" font-size="23" font-weight="400">derselben Probe.</text>
<text x="64" y="580.0" fill="#6b6b63" font-size="21" font-weight="400">Aussagekr&#228;ftig wird es bei gr&#246;&#223;eren Abst&#228;nden und vor allem im</text>
<text x="64" y="610.0" fill="#6b6b63" font-size="21" font-weight="400">Verlauf.</text>
</svg>