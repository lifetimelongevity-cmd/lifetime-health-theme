<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Die Kennzeichen des Alterns</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Der Rahmen des Feldes seit 2013</text>
<line x1="64" y1="172" x2="836" y2="172" stroke="#eceae3" stroke-width="1"/>
<rect x="64" y="214" width="358" height="148" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="243" y="292" fill="#26251e" font-size="60" font-weight="400" text-anchor="middle">9</text>
<text x="243" y="332" fill="#6b6b63" font-size="21" font-weight="400" text-anchor="middle">Kennzeichen 2013</text>
<line x1="436" y1="288" x2="462" y2="288" stroke="#4a8c85" stroke-width="3"/><path d="M462 280 l14 8 -14 8 z" fill="#4a8c85"/>
<rect x="478" y="214" width="358" height="148" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="657" y="292" fill="#26251e" font-size="60" font-weight="400" text-anchor="middle">12</text>
<text x="657" y="332" fill="#6b6b63" font-size="21" font-weight="400" text-anchor="middle">Kennzeichen 2023</text>
<text x="64" y="420" fill="#26251e" font-size="25" font-weight="400">Epigenetische Ver&#228;nderungen sind eines dieser Kennzeichen.</text>
<text x="64" y="454" fill="#6b6b63" font-size="21" font-weight="400">Ein epigenetischer Alterswert deckt eines von zw&#246;lf ab.</text>
<line x1="64" y1="490.0" x2="836" y2="490.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="524.0" fill="#26251e" font-size="23" font-weight="400">L&#243;pez-Ot&#237;n et al., Cell 2013 und Cell 2023.</text>
<text x="64" y="554.0" fill="#6b6b63" font-size="21" font-weight="400">Die Kennzeichen greifen ineinander. Ein einzelner Hebel steht nicht</text>
<text x="64" y="584.0" fill="#6b6b63" font-size="21" font-weight="400">in der Liste.</text>
