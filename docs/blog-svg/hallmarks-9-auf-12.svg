<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="630" rx="0" fill="#f7f4ee"/>
