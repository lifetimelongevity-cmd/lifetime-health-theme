<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="610" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="554" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Wie eine epigenetische Uhr rechnet</text>
<line x1="64" y1="146" x2="836" y2="146" stroke="#eceae3" stroke-width="1"/>
<rect x="64" y="188" width="232" height="180" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="84" y="240" fill="#26251e" font-size="27" font-weight="500">Methylierung</text>
<text x="84" y="278" fill="#6b6b63" font-size="21" font-weight="400">chemische</text>
<text x="84" y="304" fill="#6b6b63" font-size="21" font-weight="400">Markierungen an</text>
<text x="84" y="330" fill="#6b6b63" font-size="21" font-weight="400">der DNA</text>
<line x1="300" y1="278.0" x2="334" y2="278.0" stroke="#4a8c85" stroke-width="3"/><path d="M334 270.0 l14 8 -14 8 z" fill="#4a8c85"/>
<rect x="338" y="188" width="232" height="180" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="358" y="240" fill="#26251e" font-size="27" font-weight="500">Modell</text>
<text x="358" y="278" fill="#6b6b63" font-size="21" font-weight="400">353 Messstellen,</text>
<text x="358" y="304" fill="#6b6b63" font-size="21" font-weight="400">an rund 8.000</text>
<text x="358" y="330" fill="#6b6b63" font-size="21" font-weight="400">Proben entwickelt</text>
<line x1="574" y1="278.0" x2="608" y2="278.0" stroke="#4a8c85" stroke-width="3"/><path d="M608 270.0 l14 8 -14 8 z" fill="#4a8c85"/>
<rect x="612" y="188" width="232" height="180" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="632" y="240" fill="#26251e" font-size="27" font-weight="500">Sch&#228;tzwert</text>
<text x="632" y="278" fill="#6b6b63" font-size="21" font-weight="400">eine Alterszahl</text>
<text x="632" y="304" fill="#6b6b63" font-size="21" font-weight="400">in Jahren</text>
<text x="64" y="426" fill="#26251e" font-size="24" font-weight="400">Verschiedene Uhren liefern f&#252;r dieselbe Person verschiedene</text>
<text x="64" y="458" fill="#26251e" font-size="24" font-weight="400">Werte, ohne sich zu widersprechen.</text>
<line x1="64" y1="494.0" x2="836" y2="494.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="528.0" fill="#26251e" font-size="23" font-weight="400">Erste Uhr: Horvath, Genome Biology 2013, Proben aus 51 Geweben.</text>
<text x="64" y="558.0" fill="#6b6b63" font-size="21" font-weight="400">Eine Uhr misst. Sie ver&#228;ndert das Altern nicht.</text>
</svg>