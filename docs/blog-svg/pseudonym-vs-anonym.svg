<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="670" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="614" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Pseudonymisiert oder anonym</text>
<text x="64" y="142" fill="#6b6b63" font-size="24" font-weight="400">Der Unterschied entscheidet, ob du noch Rechte an den Daten</text>
<text x="64" y="172" fill="#6b6b63" font-size="24" font-weight="400">hast</text>
<line x1="64" y1="202" x2="836" y2="202" stroke="#eceae3" stroke-width="1"/>
<rect x="64.0" y="244" width="376.0" height="250" rx="12" fill="#f2f8f6" stroke="#d6e7e2"/>
<text x="86.0" y="290" fill="#26251e" font-size="30" font-weight="500">Pseudonymisiert</text>
<text x="86.0" y="330" fill="#6b6b63" font-size="24" font-weight="400">Die Probe tr&#228;gt eine ID</text>
<text x="86.0" y="362" fill="#6b6b63" font-size="24" font-weight="400">statt deines Namens.</text>
<text x="86.0" y="394" fill="#6b6b63" font-size="24" font-weight="400">Die Verbindung liegt</text>
<text x="86.0" y="426" fill="#6b6b63" font-size="24" font-weight="400">getrennt, existiert aber.</text>
<text x="86.0" y="458" fill="#4a8c85" font-size="24" font-weight="500">DSGVO gilt, du hast Rechte</text>
<rect x="460.0" y="244" width="376.0" height="250" rx="12" fill="#f5f4f0" stroke="#e7e3db"/>
<text x="482.0" y="290" fill="#26251e" font-size="30" font-weight="500">Anonymisiert</text>
<text x="482.0" y="330" fill="#6b6b63" font-size="24" font-weight="400">Die Verbindung ist nicht</text>
<text x="482.0" y="362" fill="#6b6b63" font-size="24" font-weight="400">mehr herstellbar.</text>
<text x="482.0" y="394" fill="#6b6b63" font-size="24" font-weight="400">Niemand wei&#223;, wem ein</text>
<text x="482.0" y="426" fill="#6b6b63" font-size="24" font-weight="400">Ergebnis geh&#246;rt.</text>
<text x="482.0" y="458" fill="#4a8c85" font-size="24" font-weight="500">DSGVO gilt nicht mehr</text>
<line x1="64" y1="530.0" x2="836" y2="530.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="564.0" fill="#26251e" font-size="23" font-weight="400">Ein Test, der dir dein pers&#246;nliches Ergebnis zur&#252;ckgibt, kann</text>
<text x="64" y="594.0" fill="#26251e" font-size="23" font-weight="400">nicht anonym arbeiten.</text>
<text x="64" y="624.0" fill="#6b6b63" font-size="21" font-weight="400">Artikel 4 Nummer 5 der Datenschutz-Grundverordnung.</text>
</svg>