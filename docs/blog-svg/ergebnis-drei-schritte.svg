<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif" role="img"><rect x="0" y="0" width="900" height="600" rx="0" fill="#f7f4ee"/>
<rect x="28" y="28" width="844" height="544" rx="14" fill="#ffffff" stroke="#e7e3db"/>
<text x="64" y="104" fill="#26251e" font-size="38" font-weight="400">Drei Schritte nach dem Ergebnis</text>
<line x1="64" y1="146" x2="836" y2="146" stroke="#eceae3" stroke-width="1"/>
<circle cx="86" cy="184" r="22" fill="#4a8c85"/>
<text x="86" y="193" fill="#f7f4ee" font-size="24" font-weight="500" text-anchor="middle">1</text>
<text x="132" y="190" fill="#26251e" font-size="28" font-weight="500">Ausgangspunkt festhalten</text>
<text x="132" y="222" fill="#6b6b63" font-size="22" font-weight="400">Probendatum, Verfahren, Anbieter und deine Verfassung dieser Woche</text>
<line x1="86" y1="212" x2="86" y2="250" stroke="#e7e3db" stroke-width="2"/>
<circle cx="86" cy="282" r="22" fill="#4a8c85"/>
<text x="86" y="291" fill="#f7f4ee" font-size="24" font-weight="500" text-anchor="middle">2</text>
<text x="132" y="288" fill="#26251e" font-size="28" font-weight="500">Aus Werten Fragen machen</text>
<text x="132" y="320" fill="#6b6b63" font-size="22" font-weight="400">Nicht was kaufe ich, sondern welche Belastung war dauerhaft</text>
<line x1="86" y1="310" x2="86" y2="348" stroke="#e7e3db" stroke-width="2"/>
<circle cx="86" cy="380" r="22" fill="#4a8c85"/>
<text x="86" y="389" fill="#f7f4ee" font-size="24" font-weight="500" text-anchor="middle">3</text>
<text x="132" y="386" fill="#26251e" font-size="28" font-weight="500">Zweite Messung planen</text>
<text x="132" y="418" fill="#6b6b63" font-size="22" font-weight="400">Gleiches Verfahren, gleiches Labor, genug Abstand</text>
<line x1="64" y1="454.0" x2="836" y2="454.0" stroke="#eceae3" stroke-width="1"/>
<text x="64" y="488.0" fill="#26251e" font-size="23" font-weight="400">Der Gewinn liegt in der dritten und vierten Messung, nicht in</text>
<text x="64" y="518.0" fill="#26251e" font-size="23" font-weight="400">der zweiten.</text>
<text x="64" y="548.0" fill="#6b6b63" font-size="21" font-weight="400">Bei Beschwerden geh&#246;rt die Abkl&#228;rung in &#228;rztliche Hand.</text>
</svg>