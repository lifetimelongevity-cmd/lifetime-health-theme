<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verlauf: Ausgangswert und Richtung</title>
<meta name="description" content="Diagramm der Section Warum jetzt auf der AGE&DNA-PDP: heute ein gemessener Ausgangswert, in sechs Monaten zwei mögliche Richtungen. Neu gezeichnet 28.10.2026.">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f7f4; --ink:#26251e; --soft:#6b6b63; --accent:#364f56; --rule:rgba(54,79,86,.14);
    --head:"Helvetica Neue",Helvetica,Arial,sans-serif; --body:Lato,-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body)}
  main{max-width:720px;margin:0 auto;padding:48px 16px 64px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 8px}
  h1{font-family:var(--head);font-weight:400;font-size:36px;line-height:1.15;letter-spacing:-.02em;margin:0 0 32px}
  .scroll{overflow-x:auto}
  svg{display:block;width:100%;max-width:448px;height:auto;overflow:visible}
  .ax{fill:none;stroke:var(--rule);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
  .arrow{stroke:var(--soft)}
  .tick{stroke:var(--soft);stroke-width:1}
  .ref{fill:none;stroke:var(--soft);stroke-width:1;stroke-dasharray:1 4;stroke-linecap:round;opacity:.55}
  .ln{fill:none;stroke:var(--accent);stroke-width:1.25;stroke-linecap:round}
  .halo{fill:var(--accent);opacity:.1}
  .p0{fill:var(--accent)}
  .p1{fill:var(--paper);stroke:var(--accent);stroke-width:1.25}
  text{font-family:var(--body);fill:var(--soft)}
  .cap,.time{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .time{fill:var(--ink)}
  .note{font-size:14px}
  .end{font-family:var(--head);font-size:16px;fill:var(--ink);letter-spacing:-.01em}
</style>
</head>
<body>
<main>
  <p class="eyebrow">AGE&amp;DNA-PDP · Warum jetzt</p>
  <h1>Ausgangswert und Richtung</h1>
  <div class="scroll">
    <svg viewBox="0 0 364 156" role="img" aria-labelledby="verlauf-title verlauf-desc">
      <title id="verlauf-title">Ausgangswert und Richtung</title>
      <desc id="verlauf-desc">Heute wird das biologische Alter einmal gemessen, sechs Monate später zeigt die zweite Messung, ob es in Richtung älter oder jünger gegangen ist.</desc>
      <defs>
        <linearGradient id="verlauf-korridor" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="284" y2="0">
          <stop offset="0" stop-color="#364f56" stop-opacity="0.14"/>
          <stop offset="1" stop-color="#364f56" stop-opacity="0.03"/>
        </linearGradient>
      </defs>
      <path class="ax" d="M4 112 V20"/>
      <path class="ax arrow" d="M0.5 24 L4 19.5 L7.5 24"/>
      <text class="cap" x="14" y="24">Biologisches Alter</text>
      <path class="ax" d="M4 112 H364"/>
      <path class="tick" d="M56 112 V117 M284 112 V117"/>
      <path class="ref" d="M56 64 H284"/>
      <path d="M56 64 L284 28 L284 100 Z" fill="url(#verlauf-korridor)"/>
      <path class="ln" d="M56 64 L284 28"/>
      <path class="ln" d="M56 64 L284 100"/>
      <circle class="halo" cx="56" cy="64" r="12"/>
      <circle class="p0" cx="56" cy="64" r="5"/>
      <circle class="p1" cx="284" cy="28" r="5"/>
      <circle class="p1" cx="284" cy="100" r="5"/>
      <text class="end" x="298" y="33">älter</text>
      <text class="end" x="298" y="105">jünger</text>
      <text class="time" x="56" y="136" text-anchor="middle">Heute</text>
      <text class="note" x="56" y="153" text-anchor="middle">Ausgangswert</text>
      <text class="time" x="284" y="136" text-anchor="middle">In 6 Monaten</text>
      <text class="note" x="284" y="153" text-anchor="middle">die Richtung</text>
    </svg>
  </div>
</main>
</body>
</html>
