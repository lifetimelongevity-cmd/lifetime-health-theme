<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Zwei Zahlen nebeneinander. Links 45 als Kalenderalter, rechts 41 als biologisches Alter. Dieselbe Person, die zweite Zahl kann hoeher oder niedriger sein. Beispielwerte, keine Messung.">
  <text x="215" y="200" fill="#26251e" font-size="150" font-weight="500" text-anchor="middle">45</text>
  <text x="215" y="246" fill="#26251e" fill-opacity="0.55" font-size="21" text-anchor="middle">Kalenderalter</text>

  <line x1="335" y1="90" x2="335" y2="262" stroke="#ddd8cd" stroke-width="1.5"/>

  <text x="455" y="200" fill="#4a8c85" font-size="150" font-weight="500" text-anchor="middle">41</text>
  <text x="455" y="246" fill="#26251e" fill-opacity="0.55" font-size="21" text-anchor="middle">biologisches Alter</text>

  <text x="40" y="326" fill="#26251e" fill-opacity="0.72" font-size="19">Dieselbe Person. Die zweite Zahl kann höher oder niedriger sein.</text>

  <line x1="40" y1="356" x2="620" y2="356" stroke="#26251e" stroke-opacity="0.1" stroke-width="1"/>
  <text x="40" y="386" fill="#26251e" fill-opacity="0.45" font-size="16">Beispielwerte, keine Messung.</text>
</svg>
