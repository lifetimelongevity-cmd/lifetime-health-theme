<svg xmlns="http://www.w3.org/2000/svg" width="620" height="520" viewBox="0 0 620 520" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Ein durchschnittliches Leben umfasst 72,5 Jahre Lebenserwartung, davon 63,3 Jahre bei guter Gesundheit und 9,2 Jahre mit Krankheit. Diese Lücke wächst weltweit von 8,5 auf 9,6 Jahre seit dem Jahr 2000. Quelle: Garmany und Terzic, JAMA Network Open 2024, WHO-Daten.">
  <text x="40" y="52" fill="#26251e" fill-opacity="0.5" font-size="20" font-weight="500" letter-spacing="1.5">IM WELTWEITEN DURCHSCHNITT</text>
  <text x="40" y="98" fill="#26251e" font-size="29" font-weight="400">72,5 Jahre Lebenserwartung</text>

  <rect x="40" y="128" width="471" height="86" rx="10" fill="#4a8c85"/>
  <rect x="517" y="128" width="63" height="86" rx="10" fill="#cfc8ba"/>
  <text x="62" y="181" fill="#ffffff" font-size="28" font-weight="500">63,3 Jahre gesund</text>

  <text x="40" y="356" fill="#26251e" font-size="128" font-weight="700" letter-spacing="-3">9,2</text>
  <text x="40" y="396" fill="#26251e" font-size="25" font-weight="400">Jahre mit Krankheit</text>

  <text x="40" y="450" fill="#26251e" fill-opacity="0.6" font-size="21" font-weight="400">Weltweit von 8,5 auf 9,6 Jahre seit 2000.</text>

  <line x1="40" y1="480" x2="580" y2="480" stroke="#26251e" stroke-opacity="0.1" stroke-width="1"/>
  <text x="40" y="506" fill="#26251e" fill-opacity="0.45" font-size="15" font-weight="400">Garmany und Terzic, JAMA Netw Open 2024. WHO 2000&#8211;2019.</text>
</svg>
