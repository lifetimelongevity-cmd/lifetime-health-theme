<svg xmlns="http://www.w3.org/2000/svg" width="620" height="520" viewBox="0 0 620 520" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="In Deutschland stehen rund 81 Jahren Lebenserwartung etwa 64 gesunde Lebensjahre gegenüber. Rund 17 Jahre entfallen auf gesundheitliche Einschränkungen, das ist etwa ein Fünftel der Lebenszeit. Quelle: Statistisches Bundesamt 2023 und Eurostat, gesunde Lebensjahre 2022.">
  <text x="40" y="52" fill="#26251e" fill-opacity="0.5" font-size="20" font-weight="500" letter-spacing="1.5">IN DEUTSCHLAND</text>
  <text x="40" y="98" fill="#26251e" font-size="29" font-weight="400">rund 81 Jahre Lebenserwartung</text>

  <rect x="40" y="128" width="424" height="86" rx="10" fill="#4a8c85"/>
  <rect x="470" y="128" width="110" height="86" rx="10" fill="#cfc8ba"/>
  <text x="62" y="181" fill="#ffffff" font-size="28" font-weight="500">rund 64 Jahre gesund</text>

  <text x="40" y="356" fill="#26251e" font-size="128" font-weight="700" letter-spacing="-3">17</text>
  <text x="40" y="396" fill="#26251e" font-size="25" font-weight="400">Jahre mit Einschränkungen</text>

  <text x="40" y="450" fill="#26251e" fill-opacity="0.6" font-size="21" font-weight="400">Rund ein Fünftel der Lebenszeit.</text>

  <line x1="40" y1="480" x2="580" y2="480" stroke="#26251e" stroke-opacity="0.1" stroke-width="1"/>
  <text x="40" y="506" fill="#26251e" fill-opacity="0.45" font-size="15" font-weight="400">Statistisches Bundesamt 2023 &#183; Eurostat, gesunde Lebensjahre 2022.</text>
</svg>
