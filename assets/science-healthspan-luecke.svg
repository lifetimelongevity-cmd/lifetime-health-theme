<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Ein durchschnittliches Leben von 72,5 Jahren, davon 63,3 Jahre bei guter Gesundheit und 9,2 Jahre mit Krankheit. Diese Luecke waechst weltweit.">
  <rect width="1200" height="800" fill="#f7f4ee"/>
  <text x="160" y="100" fill="#6b6b63" font-size="17" font-weight="500" letter-spacing="3.5">LEBENSJAHRE UND GESUNDE JAHRE</text>

  <line x1="160" y1="238" x2="1040" y2="238" stroke="#d3cec3" stroke-width="1"/>
  <text x="160" y="226" fill="#9a948a" font-size="16">Geburt</text>
  <text x="1040" y="226" fill="#9a948a" font-size="16" text-anchor="end">72,5 Jahre Lebenserwartung</text>

  <rect x="160" y="268" width="768" height="88" rx="6" fill="#4a8c85"/>
  <rect x="928" y="268" width="112" height="88" rx="6" fill="#b9b3a7"/>
  <text x="188" y="323" fill="#ffffff" font-size="28" font-weight="500">63,3 Jahre bei guter Gesundheit</text>

  <path d="M 928 374 v 16 H 1040 v -16" fill="none" stroke="#a8a49a" stroke-width="2"/>
  <text x="984" y="484" fill="#26251e" font-size="66" font-weight="700" text-anchor="middle" letter-spacing="-1">9,2</text>
  <text x="984" y="522" fill="#6b6b63" font-size="19" text-anchor="middle">Jahre mit Krankheit</text>

  <text x="160" y="474" fill="#26251e" font-size="23">Und diese Strecke wächst.</text>
  <text x="160" y="512" fill="#6b6b63" font-size="19">Weltweit von 8,5 auf 9,6 Jahre seit dem Jahr 2000.</text>

  <line x1="160" y1="662" x2="1040" y2="662" stroke="#eae6dd" stroke-width="1"/>
  <text x="160" y="702" fill="#26251e" font-size="20">Länger leben heißt bisher vor allem: länger krank sein.</text>
  <text x="160" y="732" fill="#6b6b63" font-size="15">Mittel der 183 WHO-Mitgliedsstaaten. Garmany und Terzic, JAMA Netw Open 2024, WHO-Daten 2000 bis 2019.</text>
</svg>